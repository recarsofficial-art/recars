<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Recars - Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #F8F9FA;
      color: #101216;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 24px;
      padding: 36px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 24px;
      color: #101216;
    }
    .logo span {
      color: #E5325C;
    }
    .icon-circle {
      width: 72px;
      height: 72px;
      background: #FFF0F3;
      border: 2px solid #FFD6DF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: #E5325C;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #101216;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #6B7078;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn-primary {
      display: block;
      width: 100%;
      background: #E5325C;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 14px;
      padding: 14px 20px;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(229, 50, 92, 0.25);
      transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:active {
      transform: scale(0.98);
      background: #D4264E;
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 14px;
      color: #101216;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      padding: 8px 16px;
    }
    .tagline {
      margin-top: 28px;
      font-size: 11px;
      font-weight: 600;
      color: #9CA3AF;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">RE<span>CARS</span></div>
    <div class="icon-circle">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>No Internet Connection</h1>
    <p>Please check your cellular data or Wi-Fi connection and tap below to retry loading Recars.</p>
    <button class="btn-primary" onclick="window.location.href='https://www.recars.in'">Retry Connection</button>
    <a href="tel:+919908796677" class="btn-secondary">
      <span>Need help? Call +91 99087 96677</span>
    </a>
    <div class="tagline">Trust Every Drive. Value Every Rupee.</div>
  </div>
</body>
</html>
